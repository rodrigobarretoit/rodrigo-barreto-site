<!--
  Rodrigo — modern illustrated avatar.
  Flat, geometric style. Colors match the site palette
  (dark navy background, warm amber accent).
  Rendered as the hero portrait by default; the real photo
  cross-fades in on hover.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"
     role="img" aria-label="Illustration of Rodrigo Barreto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2547"/>
      <stop offset="1" stop-color="#0a1024"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="70%">
      <stop offset="0" stop-color="#d4a24b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4a24b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="polo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9670"/>
      <stop offset="1" stop-color="#6f7a58"/>
    </linearGradient>
  </defs>

  <!-- Background: navy gradient with a warm halo, mirrors the site's hero -->
  <rect width="300" height="400" fill="url(#bg)"/>
  <rect width="300" height="400" fill="url(#glow)"/>

  <!-- Shoulders / polo (matches olive shirt in the real photo) -->
  <path d="M 35 400 Q 35 305 90 278 L 210 278 Q 265 305 265 400 Z" fill="url(#polo)"/>
  <!-- Polo collar V-notch -->
  <path d="M 132 278 L 150 304 L 168 278 Z" fill="#5f6a4b"/>
  <!-- Backpack strap on the left shoulder -->
  <path d="M 55 400 L 60 305 Q 65 288 82 285 L 92 302 L 82 400 Z" fill="#1a1a1a" opacity="0.85"/>

  <!-- Neck -->
  <path d="M 130 240 L 130 285 L 170 285 L 170 240 Z" fill="#d9a67a"/>
  <!-- Neck shadow (under jaw) -->
  <path d="M 130 258 Q 150 274 170 258 L 170 285 L 130 285 Z" fill="#c39366"/>

  <!-- Headphones around the neck (subtle nod to the real photo) -->
  <path d="M 92 288 Q 92 268 108 262" stroke="#0f0f14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M 208 288 Q 208 268 192 262" stroke="#0f0f14" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <ellipse cx="93" cy="293" rx="15" ry="11" fill="#161616"/>
  <ellipse cx="207" cy="293" rx="15" ry="11" fill="#161616"/>
  <ellipse cx="93" cy="293" rx="6" ry="4" fill="#2a2a2a"/>
  <ellipse cx="207" cy="293" rx="6" ry="4" fill="#2a2a2a"/>

  <!-- Face -->
  <ellipse cx="150" cy="176" rx="58" ry="72" fill="#e6b487"/>
  <!-- Cheek warmth (very subtle) -->
  <ellipse cx="112" cy="205" rx="12" ry="8" fill="#d99a70" opacity="0.5"/>
  <ellipse cx="188" cy="205" rx="12" ry="8" fill="#d99a70" opacity="0.5"/>

  <!-- Ears -->
  <ellipse cx="91" cy="182" rx="9" ry="15" fill="#d9a67a"/>
  <ellipse cx="209" cy="182" rx="9" ry="15" fill="#d9a67a"/>

  <!-- Hair (short, dark, slight forehead line) -->
  <path d="M 92 148 Q 92 95 150 88 Q 208 95 208 148 L 208 158
           Q 195 130 150 128 Q 105 130 92 158 Z" fill="#1c140f"/>
  <!-- Hair sides (fade / shorter cut) -->
  <path d="M 90 148 L 96 205 L 88 205 Z" fill="#1c140f" opacity="0.85"/>
  <path d="M 210 148 L 204 205 L 212 205 Z" fill="#1c140f" opacity="0.85"/>

  <!-- Eyebrows -->
  <path d="M 112 163 Q 125 158 140 164" stroke="#1c140f"
        stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 160 164 Q 175 158 188 163" stroke="#1c140f"
        stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Glasses -->
  <rect x="100" y="170" width="46" height="30" rx="6"
        fill="rgba(255,255,255,0.04)" stroke="#0f0f14" stroke-width="3"/>
  <rect x="154" y="170" width="46" height="30" rx="6"
        fill="rgba(255,255,255,0.04)" stroke="#0f0f14" stroke-width="3"/>
  <line x1="146" y1="185" x2="154" y2="185" stroke="#0f0f14" stroke-width="3"/>

  <!-- Eyes -->
  <circle cx="123" cy="185" r="2.8" fill="#0f0f14"/>
  <circle cx="177" cy="185" r="2.8" fill="#0f0f14"/>

  <!-- Nose (very subtle line, just enough to suggest structure) -->
  <path d="M 150 200 Q 146 218 150 224" stroke="#c39366"
        stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- Mustache -->
  <path d="M 122 230 Q 135 225 150 229 Q 165 225 178 230
           Q 172 240 150 237 Q 128 240 122 230 Z" fill="#1c140f"/>

  <!-- Beard (well-groomed, follows jawline) -->
  <path d="M 108 218 Q 106 246 128 258 Q 150 268 172 258
           Q 194 246 192 218 Q 186 232 172 240 Q 150 246 128 240
           Q 114 232 108 218 Z" fill="#1c140f"/>

  <!-- Mouth (subtle) -->
  <path d="M 138 244 Q 150 248 162 244" stroke="#7a3a2a"
        stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.75"/>

  <!-- Small amber signature dot (brand accent) -->
  <circle cx="255" cy="35" r="5" fill="#e2b969"/>
</svg>
